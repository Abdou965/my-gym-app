{% extends "base.html" %}
{% block content %}
{% if error == "rest_day" %}
<div class="card" style="border-right:3px solid var(--red);font-size:12px;color:var(--red);margin-bottom:10px">
  ⚠️ لا يمكن بدء جلسة في يوم راحة. اختر يوماً آخر من الأيام أدناه.
</div>
{% endif %}
<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:11px">
  <h2>البرنامج</h2>
</div>

<label class="inp-lbl">البرنامج</label>
<select class="inp" style="margin-bottom:10px"
        hx-post="/workout/select-program" hx-trigger="change" hx-target="#day-panel-wrap" hx-swap="innerHTML"
        name="program_id">
  {% for p in programs %}
  <option value="{{ p.id }}" {{ 'selected' if program and p.id == program.id }}>{{ p.name }}</option>
  {% endfor %}
</select>

<div id="day-panel-wrap">
  {% include "components/day_panel.html" %}
</div>

<div class="sec" style="margin-top:18px">
  تمارين مخصصة
</div>
<form hx-post="/exercises" hx-target="#custom-ex-list" hx-swap="innerHTML" style="margin-bottom:10px">
  <input class="inp" name="name" placeholder="اسم التمرين" required style="margin-bottom:6px">
  <div class="r3" style="gap:6px;margin-bottom:6px">
    <input class="inp" name="muscle_group" placeholder="العضلة">
    <input class="inp" type="number" name="sets" placeholder="مجموعات" value="3">
    <input class="inp" name="tip" placeholder="نصيحة">
  </div>
  <div class="r2" style="gap:6px;margin-bottom:6px">
    <input class="inp" type="number" name="min_reps" placeholder="أقل تكرار" value="8">
    <input class="inp" type="number" name="max_reps" placeholder="أعلى تكرار" value="12">
  </div>
  <button class="btn btn-o" type="submit">+ إضافة تمرين مخصص</button>
</form>
<div id="custom-ex-list">
  {% include "components/custom_ex_list.html" %}
</div>
{% endblock %}
